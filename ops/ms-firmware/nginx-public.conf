server {
    listen 80;
    listen [::]:80;
    server_name firmware-ms.157.22.203.6.nip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name firmware-ms.157.22.203.6.nip.io;

    ssl_certificate /etc/letsencrypt/live/firmware-ms.157.22.203.6.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/firmware-ms.157.22.203.6.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /srv/ms-firmware/staging/firmware;
    autoindex off;
    access_log /var/log/nginx/ms-firmware-access.log;
    error_log /var/log/nginx/ms-firmware-error.log;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ready"}';
    }

    location = /assembly.json {
        limit_except GET { deny all; }
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /catalog.json {
        limit_except GET { deny all; }
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~* \.zip$ {
        limit_except GET { deny all; }
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        limit_except GET { deny all; }
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
