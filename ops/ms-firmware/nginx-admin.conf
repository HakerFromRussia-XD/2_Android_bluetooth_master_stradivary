server {
    listen 80;
    listen [::]:80;
    server_name firmware-admin-ms.157.22.203.6.nip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name firmware-admin-ms.157.22.203.6.nip.io;

    ssl_certificate /etc/letsencrypt/live/firmware-ms.157.22.203.6.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/firmware-ms.157.22.203.6.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/ms-firmware-admin-access.log;
    error_log /var/log/nginx/ms-firmware-admin-error.log;
    client_max_body_size 25m;

    location = /publish/ {
        return 302 /web/client/;
    }

    location = /publisher/ {
        return 302 /web/client/;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
