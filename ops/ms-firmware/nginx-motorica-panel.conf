server {
    listen 80;
    listen [::]:80;
    server_name motorica-firmware.157.22.203.6.nip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name motorica-firmware.157.22.203.6.nip.io;

    ssl_certificate /etc/letsencrypt/live/motorica-firmware.157.22.203.6.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motorica-firmware.157.22.203.6.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/motorica-firmware-panel-access.log;
    error_log /var/log/nginx/motorica-firmware-panel-error.log;
    client_max_body_size 101m;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}
